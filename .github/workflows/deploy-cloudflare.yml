name: Deploy frontend a Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'glopsy/frontend/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: glopsy/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glopsy/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build (vite + prerender SEO)
        run: npm run build
        env:
          SITE_URL: https://app.glopsy.shop
          SEO_API: https://glopsy-back.onrender.com/api
          VITE_API_URL: /api

      - name: Deploy a Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: glopsy/frontend
          command: deploy
