name: Deploy backend (Railway)

on:
  push:
    branches: [main]
    paths:
      - 'glopsy/back/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          response=$(curl -s -X POST "https://backboard.railway.com/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceDeployV2(serviceId:\\\"$RAILWAY_SERVICE_ID\\\", environmentId:\\\"$RAILWAY_ENVIRONMENT_ID\\\") }\"}")
          echo "$response"
          echo "$response" | grep -q '"serviceInstanceDeployV2"' || { echo "No se pudo disparar el deploy"; exit 1; }
