# Render Blueprint - Glopsy
# Aplicar desde el dashboard: New + > Blueprint > selecciona el repo glopsy-
# Se crean: Postgres, Redis (Key Value) y el backend.

services:
  - type: web
    name: glopsy-back
    runtime: docker
    rootDir: glopsy/back
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ENABLE_HTTPS
        value: "0"
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENC_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: glopsy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: glopsy-redis
          type: keyvalue
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: DOMAIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DASHBOARD_ORIGIN
        sync: false
      - key: ENVIA_TOKEN
        sync: false
      - key: ENVIA_SHIPPING_API_PROD
        sync: false
      - key: MASTERSHOP_API_URL
        sync: false
      - key: CACHE_INVALIDATE_SECRET
        sync: false

  - type: keyvalue
    name: glopsy-redis
    plan: free
    ipAllowList: []

databases:
  - name: glopsy-db
    plan: free
