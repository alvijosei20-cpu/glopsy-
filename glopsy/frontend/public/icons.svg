<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<!-- Background Gradient -->
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#9A00FF" />
<stop offset="50%" stop-color="#6B00D7" />
<stop offset="100%" stop-color="#21005D" />
</linearGradient>
<!-- Logo Monogram Gradient -->
<linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF" />
<stop offset="40%" stop-color="#E8B0FF" />
<stop offset="75%" stop-color="#C05CFF" />
<stop offset="100%" stop-color="#8000FF" />
</linearGradient>
<!-- Accent / Discount Tag Gradient -->
<linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#FF007A" />
<stop offset="100%" stop-color="#FF7B00" />
</linearGradient>
<!-- Inner Shadow Filter -->
<filter id="appIconShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
</filter>
<!-- Soft Glow Filter -->
<filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="12" result="blur" />
<feComposite in="SourceGraphic" in2="blur" operator="over" />
</filter>
</defs>
<!-- App Icon Base Container (iOS / Android Style Squircle) -->
<rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="url(#bgGrad)" filter="url(#appIconShadow)" />
<!-- Subtle Rim Light/Highlight -->
<rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.25" />
<!-- Main Symbol Group: Stylized 'G' Loop with Shopping Cart & Discount % -->
<g transform="translate(192, 160)">
<!-- Outer 'G' Ribbon Structure -->
<path d="M 440 100
C 240 100, 100 240, 100 420
C 100 600, 240 720, 420 720
C 560 720, 640 620, 640 500
C 640 460, 610 440, 560 440
L 380 440
C 340 440, 320 460, 320 500
C 320 540, 350 560, 390 560
L 480 560
C 460 620, 400 640, 350 640
C 240 640, 180 540, 180 420
C 180 280, 280 180, 440 180
C 520 180, 580 210, 620 250
L 670 200
C 610 140, 530 100, 440 100 Z" 
fill="url(#logoGrad)" filter="url(#neonGlow)" />
<!-- Shopping Cart Silhouette inside 'G' -->
<g transform="translate(240, 310) scale(0.85)">
<!-- Cart Body -->
<path d="M 20 20 L 70 20 L 110 160 L 260 160 L 290 60 L 100 60" 
fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
<!-- Cart Wheels -->
<circle cx="130" cy="210" r="22" fill="#FFFFFF" />
<circle cx="240" cy="210" r="22" fill="#FFFFFF" />
<!-- Discount Badge Integration (%) -->
<g transform="translate(180, -20)">
<circle cx="60" cy="60" r="65" fill="url(#accentGrad)" />
<text x="60" y="80" font-family="'Inter', 'Arial', sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle">%</text>
</g>
</g>
<!-- Typography: Glopsy -->
<text x="320" y="790" 
font-family="'System-UI', '-apple-system', 'BlinkMacSystemFont', 'Montserrat', 'Segoe UI', sans-serif" 
font-weight="800" 
font-size="88" 
fill="#FFFFFF" 
letter-spacing="2" 
text-anchor="middle">
Glopsy
</text>
</g>
</svg>